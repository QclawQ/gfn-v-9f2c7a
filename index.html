    button.filter.active { color:#fff; background:var(--brand); border-color:var(--brand); }
    .meta { display:flex; justify-content:space-between; align-items:center; margin:12px 2px; color:var(--muted); font-size:13px; }
    .cards { display:grid; gap:12px; }
    article { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 8px 30px rgba(17,58,65,.06); }
    .top { display:flex; gap:12px; align-items:flex-start; }
    .rank { flex:0 0 auto; display:grid; place-items:center; width:34px; height:34px; border-radius:11px; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand2)); font-weight:800; }
    h2 { margin:1px 0 4px; font-size:19px; letter-spacing:-.02em; }
    .identity { color:var(--muted); font-size:13px; line-height:1.4; }
    .label { margin-top:13px; color:var(--brand); font-size:11px; font-weight:800; letter-spacing:.08em; }
    .value { margin-top:4px; font-size:14px; line-height:1.55; }
    details { margin-top:11px; border-top:1px solid var(--line); padding-top:11px; }
    summary { color:var(--brand); font-size:13px; font-weight:750; cursor:pointer; }
    .actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:14px; }
    .actions a { text-decoration:none; text-align:center; padding:10px 8px; border-radius:11px; background:#edf5f5; color:var(--brand); font-size:13px; font-weight:750; }
    .actions a.primary { background:var(--brand); color:#fff; }
    .empty { padding:36px 18px; text-align:center; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:18px; }
    footer { margin-top:24px; color:var(--muted); font-size:12px; line-height:1.5; text-align:center; }

    const state = { query:"", campus:"全部" };
    const search = document.querySelector("#search");

    const cards = document.querySelector("#cards");
    const count = document.querySelector("#count");
    const campuses = ["全部","云栖","云谷","北大","待确认"];

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function link(label, href, primary) {
      const a = el("a", primary ? "primary" : "", label);
      a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
      return a;
    }
    function field(parent, label, value) {
      parent.append(el("div","label",label), el("div","value",value));
    }
    function renderFilters() {
      filters.replaceChildren();
      campuses.forEach(function(name) {
        const button = el("button","filter" + (state.campus === name ? " active" : ""),name);
        button.type = "button";
        button.onclick = function(){ state.campus=name; renderFilters(); renderCards(); };
        filters.append(button);
      });
    }
    function renderCards() {
      const q = state.query.trim().toLowerCase();
      const visible = records.filter(function(r) {
        const campusMatch = state.campus === "全部" || r.campus === state.campus;
        const text = Object.values(r).join(" ").toLowerCase();
        return campusMatch && (!q || text.includes(q));
      });
      count.textContent = "显示 " + visible.length + " / " + records.length + " 位";

        field(detail,"到访前动作",r.action);
        card.append(detail);
        const actions = el("div","actions");
        actions.append(

          link("地址来源",r.source,false)
        );

      });
